<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b8b"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <filter id="homeGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#9f1239" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Chimney -->
  <rect x="42" y="14" width="8" height="15" rx="2" fill="#f97316" stroke="#c2410c" stroke-width="2.5"/>
  <!-- Smoke puff -->
  <circle cx="47" cy="10" r="3" fill="#e2e8f0" opacity="0.8"/>
  <!-- Walls -->
  <rect x="12" y="27" width="40" height="28" rx="6" fill="url(#wallGrad)" stroke="#c2410c" stroke-width="3" filter="url(#homeGlow)"/>
  <!-- Roof -->
  <path d="M 6 29 L 32 8 L 58 29 Z" fill="url(#roofGrad)" stroke="#9f1239" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Door -->
  <path d="M 25 55 L 25 39 Q 32 35 39 39 L 39 55 Z" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2.5"/>
  <!-- Door knob -->
  <circle cx="36" cy="47" r="1.8" fill="#facc15"/>
  <!-- Round Attic Window -->
  <circle cx="32" cy="20" r="4.5" fill="#67e8f9" stroke="#fff" stroke-width="1.8"/>
</svg>
