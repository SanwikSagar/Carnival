<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="melonGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#7ae548"/>
      <stop offset="70%" stop-color="#46b720"/>
      <stop offset="100%" stop-color="#28830e"/>
    </radialGradient>
    <linearGradient id="stripeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#195c07"/>
      <stop offset="100%" stop-color="#124304"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#144208" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Antennae / CoComelon style bugs -->
  <g stroke="#262626" stroke-width="3" stroke-linecap="round">
    <path d="M 50 28 Q 42 12 34 16" fill="none"/>
    <path d="M 70 28 Q 78 12 86 16" fill="none"/>
  </g>
  <!-- Antenna tips (ladybug bobbles) -->
  <circle cx="33" cy="16" r="6.5" fill="#ff385c" stroke="#262626" stroke-width="2.5"/>
  <circle cx="31" cy="15" r="1.5" fill="#262626"/>
  <circle cx="34" cy="18" r="1.2" fill="#262626"/>
  <circle cx="87" cy="16" r="6.5" fill="#ff385c" stroke="#262626" stroke-width="2.5"/>
  <circle cx="85" cy="15" r="1.5" fill="#262626"/>
  <circle cx="88" cy="18" r="1.2" fill="#262626"/>

  <!-- Watermelon Main Body -->
  <g filter="url(#softGlow)">
    <ellipse cx="60" cy="68" rx="46" ry="42" fill="url(#melonGrad)" stroke="#1a5a08" stroke-width="4"/>
  </g>

  <!-- Dark Green Watermelon Stripes -->
  <path d="M 60 26 Q 58 68 60 110" stroke="url(#stripeGrad)" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 40 30 Q 34 68 40 106" stroke="url(#stripeGrad)" stroke-width="6.5" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 80 30 Q 86 68 80 106" stroke="url(#stripeGrad)" stroke-width="6.5" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 23 44 Q 18 68 25 94" stroke="url(#stripeGrad)" stroke-width="5.5" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 97 44 Q 102 68 95 94" stroke="url(#stripeGrad)" stroke-width="5.5" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- Cheerful Eyes -->
  <ellipse cx="44" cy="62" rx="7" ry="9" fill="#1e1e1e"/>
  <ellipse cx="76" cy="62" rx="7" ry="9" fill="#1e1e1e"/>
  <!-- Eye highlights -->
  <circle cx="42" cy="59" r="3" fill="#ffffff"/>
  <circle cx="46" cy="64" r="1.3" fill="#ffffff"/>
  <circle cx="74" cy="59" r="3" fill="#ffffff"/>
  <circle cx="78" cy="64" r="1.3" fill="#ffffff"/>

  <!-- Rosy Cheeks -->
  <ellipse cx="33" cy="73" rx="7.5" ry="5" fill="#ff5277" opacity="0.8"/>
  <ellipse cx="87" cy="73" rx="7.5" ry="5" fill="#ff5277" opacity="0.8"/>

  <!-- Sweet Happy Smile -->
  <path d="M 48 72 Q 60 86 72 72" fill="#99152e" stroke="#1e1e1e" stroke-width="3" stroke-linecap="round"/>
  <!-- Tongue -->
  <path d="M 53 78 Q 60 85 67 78 Q 60 74 53 78" fill="#ff7090"/>
</svg>
