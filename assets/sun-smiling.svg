<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="sunFaceGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#facc15"/>
    </radialGradient>
    <linearGradient id="rayGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="sunGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Sunbeams (12 rounded rays) -->
  <g filter="url(#sunGlow)">
    <g transform="translate(80, 80)">
      <!-- Ray 0 -->
      <rect x="-8" y="-76" width="16" height="22" rx="8" fill="url(#rayGrad)"/>
      <!-- Ray 30 -->
      <rect x="-8" y="-76" width="16" height="22" rx="8" fill="url(#rayGrad)" transform="rotate(30)"/>
      <!-- Ray 60 -->
      <rect x="-8" y="-76" width="16" height="22" rx="8" fill="url(#rayGrad)" transform="rotate(60)"/>
      <!-- Ray 90 -->
      <rect x="-8" y="-76" width="16" height="22" rx="8" fill="url(#rayGrad)" transform="rotate(90)"/>
      <!-- Ray 120 -->
      <rect x="-8" y="-76" width="16" height="22" rx="8" fill="url(#rayGrad)" transform="rotate(120)"/>
      <!-- Ray 150 -->
      <rect x="-8" y="-76" width="16" height="22" rx="8" fill="url(#rayGrad)" transform="rotate(150)"/>
      <!-- Ray 180 -->
      <rect x="-8" y="-76" width="16" height="22" rx="8" fill="url(#rayGrad)" transform="rotate(180)"/>
      <!-- Ray 210 -->
      <rect x="-8" y="-76" width="16" height="22" rx="8" fill="url(#rayGrad)" transform="rotate(210)"/>
      <!-- Ray 240 -->
      <rect x="-8" y="-76" width="16" height="22" rx="8" fill="url(#rayGrad)" transform="rotate(240)"/>
      <!-- Ray 270 -->
      <rect x="-8" y="-76" width="16" height="22" rx="8" fill="url(#rayGrad)" transform="rotate(270)"/>
      <!-- Ray 300 -->
      <rect x="-8" y="-76" width="16" height="22" rx="8" fill="url(#rayGrad)" transform="rotate(300)"/>
      <!-- Ray 330 -->
      <rect x="-8" y="-76" width="16" height="22" rx="8" fill="url(#rayGrad)" transform="rotate(330)"/>
    </g>

    <!-- Main Sun Circle -->
    <circle cx="80" cy="80" r="54" fill="url(#sunFaceGrad)" stroke="#eab308" stroke-width="4.5"/>
  </g>

  <!-- Happy Smiling Face -->
  <!-- Happy curved eyes -->
  <path d="M 60 74 Q 68 66 76 74" fill="none" stroke="#713f12" stroke-width="4" stroke-linecap="round"/>
  <path d="M 84 74 Q 92 66 100 74" fill="none" stroke="#713f12" stroke-width="4" stroke-linecap="round"/>

  <!-- Rosy Cheeks -->
  <ellipse cx="56" cy="84" rx="7.5" ry="5" fill="#f43f5e" opacity="0.65"/>
  <ellipse cx="104" cy="84" rx="7.5" ry="5" fill="#f43f5e" opacity="0.65"/>

  <!-- Cheerful Smile -->
  <path d="M 68 86 Q 80 100 92 86" fill="#be123c" stroke="#713f12" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Tongue -->
  <path d="M 74 92 Q 80 99 86 92" fill="#fb7185"/>
</svg>
