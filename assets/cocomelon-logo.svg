<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="100%" height="100%">
  <defs>
    <!-- Text Gradients -->
    <linearGradient id="textGradTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff885"/>
      <stop offset="100%" stop-color="#ffb703"/>
    </linearGradient>
    <linearGradient id="textGradSub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf4ff"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff477e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#881337" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Watermelon Icon on Left -->
  <g transform="translate(10, 6) scale(0.9)">
    <!-- Antennae -->
    <path d="M 50 28 Q 42 12 34 16" fill="none" stroke="#262626" stroke-width="3" stroke-linecap="round"/>
    <path d="M 70 28 Q 78 12 86 16" fill="none" stroke="#262626" stroke-width="3" stroke-linecap="round"/>
    <circle cx="33" cy="16" r="6" fill="#ff385c" stroke="#262626" stroke-width="2.5"/>
    <circle cx="87" cy="16" r="6" fill="#ff385c" stroke="#262626" stroke-width="2.5"/>

    <!-- Watermelon -->
    <ellipse cx="60" cy="68" rx="46" ry="42" fill="#52c41a" stroke="#135200" stroke-width="4"/>
    <path d="M 60 26 Q 58 68 60 110" stroke="#135200" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M 40 30 Q 34 68 40 106" stroke="#135200" stroke-width="6.5" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M 80 30 Q 86 68 80 106" stroke="#135200" stroke-width="6.5" stroke-linecap="round" fill="none" opacity="0.85"/>

    <!-- Eyes & Smile -->
    <ellipse cx="44" cy="62" rx="7" ry="9" fill="#1e1e1e"/>
    <ellipse cx="76" cy="62" rx="7" ry="9" fill="#1e1e1e"/>
    <circle cx="42" cy="59" r="3" fill="#ffffff"/>
    <circle cx="74" cy="59" r="3" fill="#ffffff"/>
    <ellipse cx="33" cy="73" rx="7" ry="4.5" fill="#ff4d79"/>
    <ellipse cx="87" cy="73" rx="7" ry="4.5" fill="#ff4d79"/>
    <path d="M 49 72 Q 60 84 71 72" fill="#99152e" stroke="#1e1e1e" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Cute Bubble Backing for Text -->
  <g filter="url(#logoShadow)">
    <rect x="115" y="16" width="330" height="90" rx="30" fill="url(#pillGrad)" stroke="#ffffff" stroke-width="5"/>
  </g>

  <!-- Stars on Pill -->
  <polygon points="135,32 138,38 145,39 140,44 141,51 135,48 129,51 130,44 125,39 132,38" fill="#fde047"/>
  <polygon points="425,75 427,80 432,81 428,85 429,90 425,87 421,90 422,85 418,81 423,80" fill="#fde047"/>

  <!-- Main Title Text -->
  <text x="275" y="60" text-anchor="middle"
        font-family="'Baloo 2', 'Nunito', 'Arial Rounded MT Bold', sans-serif"
        font-weight="900" font-size="44"
        fill="url(#textGradTop)" stroke="#9f1239" stroke-width="6" paint-order="stroke fill" letter-spacing="0.5">
    SPARKY'S
  </text>

  <!-- Subtitle Text -->
  <text x="275" y="94" text-anchor="middle"
        font-family="'Baloo 2', 'Nunito', 'Arial Rounded MT Bold', sans-serif"
        font-weight="900" font-size="26"
        fill="url(#textGradSub)" stroke="#9f1239" stroke-width="4.5" paint-order="stroke fill" letter-spacing="1.5">
    PLAYTIME QUEST!
  </text>
</svg>
