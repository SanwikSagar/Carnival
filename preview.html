<!doctype html><html><meta charset="utf-8"><title>Sparky pack preview</title><style>body{background:#171b23;color:#eee;font:16px system-ui;text-align:center}canvas{display:block;margin:auto;height:75vh;max-width:100%;object-fit:contain}select{padding:12px}</style><h1>Sparky animation pack</h1><select aria-label="Animation"></select><canvas></canvas><script type="module">import {SpriteSheetPlayer} from './player.js';const m=await(await fetch('./manifest.json')).json(),select=document.querySelector('select');let player;for(const e of m.animations){const o=document.createElement('option');o.value=e.metadata;o.textContent=e.name;select.append(o)}async function load(){player?.destroy();player=await SpriteSheetPlayer.load(document.querySelector('canvas'),select.value,{loop:true});player.play()}select.onchange=load;await load();</script></html>
